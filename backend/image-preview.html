
<!DOCTYPE html>
<html>
<head>
  <title>Grocery Product Images</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }
    .product {
      border: 1px solid #ddd;
      padding: 12px;
      border-radius: 10px;
    }
    img {
      width: 100%;
      height: 160px;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <h1>Grocery Product Images</h1>
  <div class="products">
    <div class="product">
      <img src="https://www.bigbasket.com/media/uploads/p/l/40075537_5-fresho-onion.jpg">
      <h3>Onion (Loose)</h3>
    </div>
  </div>
</body>
</html>
